name: CI

# Lint + tests + keyless smoke for groundskeeper itself (no secrets, no API key).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: CLI smoke
        run: uv run groundskeeper --help

      - name: Compile bundled rules (keyless)
        run: uv run groundskeeper rules --rules-dir rules
