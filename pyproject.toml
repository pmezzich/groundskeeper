[project]
name = "groundskeeper"
version = "0.1.0"
description = "Skills-enforcement PR review bot — compiles .claude/rules into CI checks"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.104.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
groundskeeper = "groundskeeper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundskeeper"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
